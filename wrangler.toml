name = "b2-pages"
compatibility_date = "2024-12-30"
# 仅用于本地开发。不要添加 pages_build_output_dir：部署时显式指定 public，
# 让生产环境配置继续由 Cloudflare Dashboard 管理，便于在后台填写 B2 变量。

# 在 Cloudflare Dashboard 中设置以下环境变量（Secrets）:
# B2_BUCKET_NAME - B2 桶名称
# B2_ENDPOINT - B2 S3 兼容端点 (如 s3.us-west-004.backblazeb2.com)
# B2_ACCESS_KEY_ID - B2 应用密钥 ID
# B2_SECRET_ACCESS_KEY - B2 应用密钥
